[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-p1d"
version = "0.1.0"
description = "Lightweight matter-to-FGPA Ly-alpha P1D calculator"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Helena Garcia Escudero"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mini-p1d = "mini_p1d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

